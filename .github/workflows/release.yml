# Builds Interlock.exe on GitHub's Windows runners and publishes it as a
# release whenever a version tag (v1.2.0 etc.) is pushed. No local builds or
# manual uploads needed.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer and package portable exe
        run: npm run dist

      - name: Publish release with exe attached
        uses: softprops/action-gh-release@v2
        with:
          files: release/Interlock.exe
          generate_release_notes: true
